<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lighthouse Dashboard — Verse & Vlam</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="audit.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="dot"></div>
    <h1>Lighthouse Dashboard</h1>
  </div>
  <div class="tools">
    <label class="btn">
      📤 Load Reports (JSON)
      <input id="file" type="file" accept="application/json" multiple />
    </label>
    <button id="btnDemo" class="btn">Use Demo</button>
    <a class="btn" href="../index.html">← Back to App</a>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2>Overview</h2>
    <p class="small">Drop one or more Lighthouse JSON reports (export from Chrome DevTools → Lighthouse → "Save as JSON").</p>
    <div id="summary" class="row"></div>
  </section>

  <section class="card">
    <h2>Scores</h2>
    <div id="scores" class="row"></div>
  </section>

  <section class="card">
    <h2>Key Metrics</h2>
    <div id="metrics"></div>
  </section>

  <section class="card">
    <h2>Opportunities & Diagnostics</h2>
    <div id="opps"></div>
  </section>

  <section class="card">
    <h2>Failed / Low Audits</h2>
    <div id="fails"></div>
  </section>

  <section class="card">
    <h2>Compare Runs</h2>
    <div id="compare"></div>
  </section>
</main>

<footer>Verse & Vlam • Audit v1.0</footer>

<script src="audit.js"></script>
</body>
</html>

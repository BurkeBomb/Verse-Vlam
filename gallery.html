<!DOCTYPE html><html lang='af'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><link rel='stylesheet' href='assets/styles.css'><link rel='stylesheet' href='assets/themes.css'><link rel='manifest' href='manifest.webmanifest'><meta name='theme-color' content='#4EE0C1'><meta name='description' content='Verse & Vlam — Afr Theosorus: taal, kleur en vlam.'><meta property='og:title' content='Verse & Vlam'><meta property='og:description' content='Afrikaanse emosie-woordeboek en kompendium.'><meta property='og:image' content='/og-image.png'><script src='assets/i18n.js' defer></script><title>Galery</title></head><body><header class='header'><div class='brand'><h1 data-i18n='gallery'>Galery</h1></div><nav class='row'><a class='chip' href='index.html' data-i18n='back'>← Terug</a></nav></header><main class='container' id='grid'></main><script>async function load(){const lex=await fetch('data/lexicon.json').then(r=>r.json());const grid=document.getElementById('grid');(lex.emotions||[]).forEach(e=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<h3><span class='chip' style='border-color:${e.color}'>#${e.id}</span> ${e.title?.af}</h3><p>${(e.imagery?.af||[]).slice(0,2).join('<br>')}</p>`;grid.appendChild(card);});}document.addEventListener('DOMContentLoaded',load);</script></body></html>
